# Netlify configuration for londontraffic (both deployments).
# scripts/deploy.sh builds locally and uploads with `netlify deploy --no-build --dir build`.
# Auth: basic-auth edge function on every path; credentials come from the site's
# BASIC_AUTH_CREDENTIALS env var or the deploy-time baked hash (see scripts/deploy.sh).
# The edge function denies every request when neither exists.

[build]
  publish = "build"

[[edge_functions]]
  path = "/*"
  function = "basic-auth"
  excludedPath = "/.netlify/*"

[[headers]]
  for = "/data/*/tiles/*.pmtiles"
  [headers.values]
    Cache-Control = "public, max-age=3600"
